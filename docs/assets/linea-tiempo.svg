<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="title desc">
  <title id="title">The history of one mobile number</title>
  <desc id="desc">One number goes through a prepaid activation, a SIM change, a migration to postpaid, an owner change, a termination, 112 days unassigned, and recycling to a new holder. The postpaid line's stored activation date points back to the prepaid activation because it was inherited; the pipeline uses an effective start date instead.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#151E33"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.86" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF8A70"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="329" rx="16" fill="url(#bg)" stroke="#24304A"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <!-- Kicker and legend -->
    <text x="56" y="52" font-size="13" font-weight="600" letter-spacing="2.4" fill="#8FA0C0">ONE NUMBER · EVERY EVENT · THE DATE IT REALLY HAPPENED</text>
    <g font-size="12" fill="#AEBBD6">
      <rect x="896" y="41" width="14" height="14" rx="3" fill="#2DD4BF"/>
      <text x="916" y="52">prepaid</text>
      <rect x="984" y="41" width="14" height="14" rx="3" fill="#FF6A4D"/>
      <text x="1004" y="52">postpaid</text>
      <rect x="1078" y="41.5" width="13" height="13" rx="3" fill="none" stroke="#6B7A99" stroke-dasharray="3 2"/>
      <text x="1098" y="52">unassigned</text>
    </g>

    <!-- The trap: the postpaid line's stored activation date points back to 2019 -->
    <path d="M 490 146 C 468 84, 152 84, 132 144" fill="none" stroke="#FF8A70" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#head)"/>
    <text x="311" y="88" text-anchor="middle" font-size="13" fill="#FF9A82">stored STA_DATETIME of the postpaid line = 2019-03-14 · inherited</text>

    <!-- Periods of the number -->
    <rect x="130" y="150" width="358" height="24" rx="5" fill="#2DD4BF"/>
    <text x="146" y="167" font-size="12.5" font-weight="700" fill="#042F2A">PRE · holder A</text>

    <rect x="492" y="150" width="176" height="24" rx="5" fill="#FF6A4D"/>
    <text x="508" y="167" font-size="12.5" font-weight="700" fill="#3A0D05">POS · holder A</text>

    <rect x="672" y="150" width="176" height="24" rx="5" fill="#FF6A4D"/>
    <text x="688" y="167" font-size="12.5" font-weight="700" fill="#3A0D05">POS · holder B</text>

    <rect x="852" y="150.5" width="176" height="23" rx="5" fill="none" stroke="#6B7A99" stroke-dasharray="5 4"/>
    <text x="868" y="167" font-size="12.5" font-weight="600" fill="#AEBBD6">unassigned · 112 days</text>

    <rect x="1032" y="150" width="128" height="24" rx="5" fill="url(#fade)"/>
    <text x="1044" y="167" font-size="12.5" font-weight="700" fill="#042F2A">PRE · holder C</text>

    <!-- Axis, ticks and event dots -->
    <line x1="110" y1="210" x2="1170" y2="210" stroke="#33415E" stroke-width="2"/>
    <g stroke="#3B4A6B" stroke-width="1" stroke-dasharray="2 3">
      <line x1="130" y1="176" x2="130" y2="203"/>
      <line x1="310" y1="176" x2="310" y2="203"/>
      <line x1="490" y1="176" x2="490" y2="203"/>
      <line x1="670" y1="176" x2="670" y2="203"/>
      <line x1="850" y1="176" x2="850" y2="203"/>
      <line x1="1030" y1="176" x2="1030" y2="203"/>
    </g>
    <g stroke="#0B1222" stroke-width="2.5">
      <circle cx="130" cy="210" r="6.5" fill="#2DD4BF"/>
      <circle cx="310" cy="210" r="6.5" fill="#2DD4BF"/>
      <circle cx="490" cy="210" r="6.5" fill="#FF6A4D"/>
      <circle cx="670" cy="210" r="6.5" fill="#FF6A4D"/>
      <circle cx="850" cy="210" r="6.5" fill="#94A3B8"/>
      <circle cx="1030" cy="210" r="6.5" fill="#2DD4BF"/>
    </g>

    <!-- Event labels: the tipo_evento values of gold.linea_tiempo -->
    <g text-anchor="middle">
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#E6EBF5">
        <text x="130" y="238">ALTA</text>
        <text x="310" y="238">CAMBIO_SIM</text>
        <text x="490" y="238">MIGRACION</text>
        <text x="670" y="238">CAMBIO_TITULAR</text>
        <text x="850" y="238">BAJA</text>
        <text x="1030" y="238">RECICLAJE</text>
      </g>
      <g font-size="12" fill="#8FA0C0">
        <text x="130" y="257">2019-03-14</text>
        <text x="310" y="257">2021-08-02</text>
        <text x="490" y="257">2023-07-05</text>
        <text x="670" y="257">2024-01-20</text>
        <text x="850" y="257">2025-02-11</text>
        <text x="1030" y="257">2025-06-03</text>
      </g>
      <g font-size="12" fill="#5EEAD4">
        <text x="490" y="276">real start: inicio_ts</text>
        <text x="1030" y="276">new customer</text>
      </g>
    </g>

    <text x="56" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6F7FA0">gold.linea_tiempo — one row per event · real date · source table · CLUSTER BY isdn9</text>
  </g>
</svg>
